name: CI

# The repository is public, so Actions minutes are free and every push and pull
# request runs the full four-platform matrix. While it was private this was
# workflow_dispatch only, and defaulted to Linux, because private-repo minutes
# bill at 1x for Linux, 2x for Windows and 10x for macOS.
#
# The manual trigger is kept for targeting a single platform when iterating on
# something platform-specific:
#
#     gh workflow run ci.yml -R liminalfield/liminal-git -f platforms=windows
on:
  push:
    branches: [main]
    # Version tags run the same full matrix and then publish what it built.
    # Nothing reaches npm that these jobs have not just compiled and tested on
    # the platform it is published for.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to test on"
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
          - macos
        required: true

concurrency:
  group: ci-${{ github.ref }}
  # A tag run publishes, so cancelling it half-way could leave the platform
  # packages on npm without the main package that depends on them.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  # Smaller cache, faster restore; debug info is not useful in CI.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Cheapest job, and it gates the rest: a formatting slip should fail in
  # ninety seconds on one runner rather than after four platforms have built
  # libgit2 from source.
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # Both feature sets are linted because they compile different code.
      # --no-default-features is how the tests build; the default napi feature
      # is how the addon builds. A lint clean under one can be dirty under the
      # other.
      - name: Clippy (test profile)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

      - name: Clippy (napi profile)
        run: cargo clippy --lib -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # A specific platform narrows the matrix; anything else — including a
        # push or pull request, where `inputs` is empty — runs all four.
        os: ${{ fromJSON(
          inputs.platforms == 'linux' && '["ubuntu-latest"]'
          || inputs.platforms == 'windows' && '["windows-latest"]'
          || inputs.platforms == 'macos' && '["macos-latest", "macos-15-intel"]'
          || '["ubuntu-latest", "macos-latest", "macos-15-intel", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # --no-default-features is required, not a preference. A test binary
      # cannot link napi: napi resolves its symbols from the host Node process
      # at run time, so with the feature on this fails at the linker.
      - name: Test
        run: cargo test --no-default-features --no-fail-fast

      # The addon itself is never exercised above, since it cannot be. This at
      # least proves it still compiles on this platform.
      - name: Check the napi build compiles
        run: cargo check --lib

  # The floor claimed by `rust-version` in Cargo.toml. Without this job the
  # number is an assertion nobody checks, and it drifts the first time someone
  # uses a newer language feature.
  msrv:
    name: MSRV
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Cargo.toml declares rust-version = $version"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      - name: Build and test on the declared minimum
        run: |
          cargo check --lib
          cargo test --no-default-features --no-fail-fast

  # Consumers install this from a git URL, which runs the `prepare` script and
  # builds the addon from source. That path is the product, so it is tested
  # rather than assumed — it needs a Rust toolchain and a C compiler on the
  # installing machine, and it is worth knowing the day that stops being true.
  build-addon:
    name: Build addon (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # A specific platform narrows the matrix; anything else — including a
        # push or pull request, where `inputs` is empty — runs all four.
        os: ${{ fromJSON(
          inputs.platforms == 'linux' && '["ubuntu-latest"]'
          || inputs.platforms == 'windows' && '["windows-latest"]'
          || inputs.platforms == 'macos' && '["macos-latest", "macos-15-intel"]'
          || '["ubuntu-latest", "macos-latest", "macos-15-intel", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Runs `prepare`, which is `napi build --platform --release`.
      - name: npm ci (builds the addon via the prepare script)
        run: npm ci

      # That build regenerates index.js and index.d.ts from the Rust source,
      # so if they differ from what is committed, the committed ones are
      # stale. This is not cosmetic: the declarations shipped to consumers
      # once described 38 async methods as synchronous, because the methods
      # became async and nobody re-ran the generator.
      #
      # Linux only. The check is about content, and running it on four
      # platforms only adds line-ending false positives.
      - name: The committed bindings match the Rust source
        if: runner.os == 'Linux'
        run: |
          if ! git diff --exit-code -- index.js index.d.ts; then
            echo "::error::index.js / index.d.ts are stale. Run 'npm run build' and commit the result."
            exit 1
          fi

      # Building inside a clone is not the same as installing this package, and
      # the difference is where the real failure lived: `npm pack` applies the
      # `files` allowlist, and without one npm falls back to .gitignore — which
      # excludes *.node, since the addon is built on install rather than
      # committed. Every check above passed while the installable package
      # contained all the Rust sources and no binding whatsoever.
      #
      # So: pack it, install the tarball somewhere else, and require it from
      # there. Installing a tarball does not run `prepare`, which is the point
      # — this proves the packed artifact carries a working binary.
      - name: A packed install loads from outside the repo
        shell: bash
        run: |
          npm pack
          work="${RUNNER_TEMP}/packtest"
          rm -rf "$work" && mkdir -p "$work" && cd "$work"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/liminal-git-*.tgz
          node -e "
            const { GitService } = require('liminal-git');
            const service = new GitService();
            if (typeof service.getStatus !== 'function') {
              throw new Error('packed install loaded but getStatus is missing');
            }
            console.log('packed install loads and constructs');
          "

      - name: The addon exists and Node can load it
        shell: bash
        run: |
          ls -la ./*.node
          node -e "
            const { GitService } = require('./index.js');
            const service = new GitService();
            if (typeof service.getStatus !== 'function') {
              throw new Error('GitService loaded but getStatus is missing');
            }
            console.log('addon loaded, GitService constructed');
          "

      # The binary this leg just built and loaded is the one that gets
      # published for this platform. Uploading it here rather than rebuilding
      # in the publish job is the whole point: what npm serves is the artifact
      # these checks passed against, not a later recompilation of the same
      # source that nobody exercised.
      - name: Upload the addon for the publish job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.os }}
          path: ./*.node
          if-no-files-found: error
          retention-days: 1

  # Publishing happens here and nowhere else. Not from a laptop: a local
  # publish would ship whatever that machine happened to have built, against
  # whatever source tree it happened to have, with no record of either.
  #
  # Gated on every other job, so a tag whose tests fail publishes nothing. The
  # tag is the trigger, but the matrix above is the permission.
  publish:
    name: Publish to npm
    needs: [lint, test, msrv, build-addon]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # This is the credential. npm trusted publishing exchanges the OIDC
      # token GitHub mints here for a short-lived registry token, scoped to
      # this repository and this workflow's filename. There is no npm secret
      # in this repository any more.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # Node 24 for npm 11, which is what speaks OIDC. Node 22 ships npm 10,
      # which does not, so trusted publishing would fail on it with an
      # authentication error that says nothing about the real cause.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # --ignore-scripts skips `prepare`, which is `napi build --release`.
      # This job has no reason to compile anything: the binaries it publishes
      # were built by the matrix above and arrive as artifacts. Without this
      # the job would install a Rust toolchain to produce a Linux binary it
      # then throws away.
      - name: Install the napi CLI only
        run: npm ci --ignore-scripts

      # A tag that disagrees with package.json means the release commit and
      # the tag came apart, and npm would take the package.json number while
      # the git history claims the other. Caught before anything is published,
      # because a version on npm is permanent and cannot be corrected in
      # place.
      - name: The tag matches the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # Checked before anything is published, because publishing is not atomic
      # across five packages and a version number can never be reused. The
      # first 1.6.0 attempt got half-way into `napi prepublish` before failing
      # on authentication, and moving that class of failure to the front is
      # what this step is for.
      #
      # There is no `npm whoami` equivalent under trusted publishing: the OIDC
      # exchange happens inside `npm publish` itself, so there is no session to
      # ask about beforehand. What can be checked is that the two things it
      # needs are here — the OIDC token endpoint, which GitHub injects only
      # when `id-token: write` is granted, and an npm new enough to use it.
      # 11.5.1 is where npm learned to publish over OIDC; below it the failure
      # is an authentication error that says nothing about the real cause.
      - name: The publishing credentials are available
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "::error::No OIDC token endpoint. This job needs 'permissions: id-token: write'."
            exit 1
          fi
          echo "npm $(npm --version), OIDC endpoint present"
          NPM_VERSION="$(npm --version)" node -e "
            const [maj, min, patch] = process.env.NPM_VERSION.split('.').map(Number);
            if (!(maj > 11 || (maj === 11 && (min > 5 || (min === 5 && patch >= 1))))) {
              console.error('::error::npm ' + process.env.NPM_VERSION + ' cannot publish over OIDC; needs 11.5.1 or newer');
              process.exit(1);
            }
          "

      - name: Collect the addons the matrix built
        uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: artifacts
          merge-multiple: true

      # Moves each liminal-git.<platform>.node into its npm/<platform>/
      # package directory, matching on the filename the build produced.
      - name: Place each addon in its platform package
        run: npx napi artifacts --output-dir artifacts

      # `napi artifacts` writes each binary to the repository root as well as
      # into its platform package, and package.json's `files` allowlist
      # includes *.node — so without this the main package ships every
      # binaries on top of the platform packages that already carry them. That
      # is what 1.6.1 did: 25MB where ~85KB was needed, downloaded by every
      # consumer on every platform, two thirds of it for machines they are not.
      #
      # `files` cannot simply drop *.node, because the git-tag install route
      # depends on it: there `prepare` compiles into this same root and npm
      # packs the result. So the entry stays and the publish job cleans up
      # after the tool instead.
      - name: The main package ships no binaries of its own
        run: rm -f ./*.node

      # One binary per declared target, or the release is incomplete. napi
      # would otherwise publish a platform package containing no addon, which
      # installs cleanly and fails at require time on the consumer's machine —
      # the same class of failure as the 1.3.1 version-guard mismatch, and
      # just as unfixable once published.
      - name: Every declared target has a binary
        run: |
          missing=0
          for dir in npm/*/; do
            if ! ls "$dir"/*.node > /dev/null 2>&1; then
              echo "::error::no addon in $dir"
              missing=1
            else
              echo "ok: $(ls "$dir"/*.node)"
            fi
          done
          exit $missing

      # AUTHENTICATION.
      #
      # There is none in this file, and that is the point. All five packages
      # have GitHub Actions configured as their trusted publisher on npmjs.com,
      # so `npm publish` exchanges the OIDC token from `id-token: write` for a
      # short-lived registry token by itself. No secret to leak, to expire, or
      # to paste in empty — which is exactly how the first 1.6.0 attempt died.
      #
      # The binding is to this repository AND this workflow's filename, which
      # npm matches exactly and case-sensitively. Renaming this file breaks
      # publishing until all four npm configurations are updated to match.
      #
      # Provenance is attested automatically under trusted publishing, so it
      # does not need --provenance.
      #
      # Catches a malformed npm/ layout or a bad config before any package is
      # published for real. Publishing is not atomic across the five packages,
      # and a version number can never be reused, so a failure discovered
      # half-way costs a version bump.
      # --no-gh-release because the option defaults to *true*: without it napi
      # POSTs to the GitHub releases API and 401s, since this job holds no
      # GitHub token. It catches the error and carries on, so it never broke
      # anything — but releases here are written by hand with their own notes,
      # and a tool quietly creating a second empty one is not wanted.
      - name: Dry run
        run: npx napi prepublish -t npm --no-gh-release --dry-run

      # Publishes the four platform packages, then rewrites the main
      # package's optionalDependencies to point at this exact version.
      - name: Publish the platform packages
        run: npx napi prepublish -t npm --no-gh-release

      # Last, so the main package never exists on npm pointing at platform
      # packages that do not. --ignore-scripts again, for the same reason as
      # the install: `prepare` would compile a binary this package does not
      # ship. The addon reaches consumers through the optionalDependencies
      # above, and index.js falls back to requiring them by name.
      # The main package's optionalDependencies name exact versions of the
      # four platform packages, so it must not be published until those are
      # actually fetchable. If one is missing, npm installs the main package
      # happily — optional dependencies fail quietly — and the error surfaces
      # at require time, on that platform only.
      #
      # The registry is eventually consistent and the lag is wildly uneven,
      # measured rather than guessed. Across 1.6.3 and 1.7.0, linux-x64-gnu
      # and darwin-arm64 were fetchable within seconds of npm reporting them,
      # and win32-x64-msvc took minutes both times — past five on 1.7.0, which
      # failed this check on a release that was in fact fine. Cache-busting
      # query params do not defeat the stale document, so there is nothing to
      # do but wait.
      #
      # Fifteen minutes per package, then. It costs nothing on the normal path
      # and the alternative is failing good releases, which is the more
      # expensive mistake: this check exists to stop a broken main package,
      # not to police npm's propagation times.
      #
      # The ordering is deliberate. Failing here leaves platform packages
      # published with no main package pointing at them, which no consumer can
      # see and a patch release fixes. Failing after the main package is
      # published is what this exists to prevent.
      - name: The registry actually has every platform package
        run: |
          version=$(node -p "require('./package.json').version")
          failed=0
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            url="https://registry.npmjs.org/${name}/-/${name}-${version}.tgz"
            code=000
            for attempt in $(seq 1 90); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
              [ "$code" = "200" ] && break
              echo "  waiting for $name@$version (HTTP $code, attempt $attempt/90)"
              sleep 10
            done
            if [ "$code" = "200" ]; then
              echo "ok: $name@$version"
            else
              echo "::error::$name@$version never appeared on the registry (HTTP $code) despite npm reporting success"
              failed=1
            fi
          done
          exit $failed

      # Last line of defence for the above. A 25MB main package installs and
      # works, which is exactly why it went unnoticed: nothing fails, everyone
      # just pays for it on every install forever, and the version cannot be
      # corrected in place.
      - name: The packed main package carries no addon
        run: |
          packed=$(npm pack --dry-run --json --ignore-scripts | node -e "
            const p = JSON.parse(require('fs').readFileSync(0, 'utf8'))[0];
            const nodes = p.files.filter(f => f.path.endsWith('.node'));
            console.log('files: ' + p.entryCount + ', unpacked: ' + p.unpackedSize + ' bytes');
            if (nodes.length) {
              console.error('::error::main package contains ' + nodes.map(f => f.path).join(', '));
              process.exit(1);
            }
          ")
          echo "$packed"

      - name: Publish the main package
        run: npm publish --ignore-scripts
