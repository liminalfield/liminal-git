[package]
name = "liminal-git"
version = "1.1.0"
edition = "2024"
# Verified, not inferred. Two things set this floor, and the higher one wins:
#   - let-chains (`if let ... && let ...`), unstable until 1.88 — 1.85 fails
#     with 23 instances of E0658.
#   - `std::fs::File::try_lock`, stabilised in 1.89 and used by `lock_repo`.
# The msrv job in CI holds this honest.
rust-version = "1.89"
description = "Native git operations for Node.js, built on libgit2 via napi-rs."
authors = ["Oluf Andrews <oluf@oandrews.com>"]
license = "MIT"
repository = "https://github.com/liminalfield/liminal-git"

# This creates a dynamic library that Node.js can load
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Git operations - the core library.
#
# "https" and "ssh" are on because remote_ops fetches and pushes. They were
# off while the crate was purely local, and turning them on has a consequence
# worth stating plainly, because it is easy to get wrong in both directions:
#
#   libgit2   statically linked
#   libssh2   statically linked (vendored C source)
#   OpenSSL   DYNAMICALLY linked on Linux — libssl.so.3, libcrypto.so.3
#
# So on Linux the compiled addon now has a *runtime* dependency it did not
# have before. Anything packaging this must declare it: Nocturne's pacman
# target lists `openssl` and its deb target `libssl3` for exactly this reason.
# An AppImage cannot declare dependencies at all, which makes that format the
# weak spot — accepted deliberately rather than solved with vendored-openssl.
#
# "vendored-openssl" is the alternative: it links OpenSSL statically, removing
# the runtime dependency, at the cost of build time and of OpenSSL's licence
# terms moving from "we use it" to "we distribute it" in
# THIRD-PARTY-NOTICES.md. Worth revisiting if portable single-file artifacts
# ever matter more than they do now.
#
# Build-time requirements per platform, which are the reverse of what people
# assume — read from libgit2-sys 0.16.2, not from memory:
#
#   Windows  nothing. openssl-sys is declared under
#            [target."cfg(unix)".dependencies], so Windows never pulls it;
#            libgit2 links winhttp/crypt32/secur32 instead.
#   Linux    OpenSSL development headers, or vendored-openssl.
#   macOS    also OpenSSL — macOS is cfg(unix) — and its system LibreSSL is
#            not accepted, so Homebrew or vendored.
#
# Build-time cost lands on whoever compiles. Run-time cost, on Linux only,
# now lands on whoever runs it.
git2 = { version = "0.21", default-features = false, features = ["https", "ssh"] }
#
# 0.21 changed a family of string accessors from Option<&str> to
# Result<&str, Error> — Reference::name/shorthand, Commit::message, Tag::message,
# Remote::name/url/pushurl, Branch::name, Signature::name/email,
# StatusEntry::path, and StringArray's iterator. The migration here is `.ok()`,
# which keeps the old behaviour exactly: a value that is not valid UTF-8 becomes
# None and is skipped, rather than failing the operation around it.
walkdir = "2.3"

# Node.js native module bindings (optional for testing)
napi = { version = "3.3", features = ["napi4", "tokio_rt"], optional = true }
napi-derive = { version = "3.0", optional = true }

# JSON serialization between Rust and JavaScript
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for future file watching, if needed)
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

# Logging. The `log` facade is used throughout; a concrete subscriber is only
# installed by GitService::new(), which exists solely under napi-binding — so
# env_logger rides along with that feature rather than burdening a plain
# `cargo build --no-default-features`.
log = "0.4"
env_logger = { version = "0.11", optional = true }

[build-dependencies]
napi-build = "2.2.3"

[features]
default = ["napi-binding"]
napi-binding = ["napi", "napi-derive", "env_logger"]

[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"
assert_matches = "1.5"
tokio-test = "0.4"
criterion = "0.5"
