[package]
name = "liminal-git"
version = "1.0.0"
edition = "2024"
# Verified, not inferred. Two things set this floor, and the higher one wins:
#   - let-chains (`if let ... && let ...`), unstable until 1.88 — 1.85 fails
#     with 23 instances of E0658.
#   - `std::fs::File::try_lock`, stabilised in 1.89 and used by `lock_repo`.
# The msrv job in CI holds this honest.
rust-version = "1.89"
description = "Native git operations for Node.js, built on libgit2 via napi-rs."
authors = ["Oluf Andrews <oluf@oandrews.com>"]
license = "MIT"
repository = "https://github.com/liminalfield/liminal-git"

# This creates a dynamic library that Node.js can load
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Git operations - the core library.
#
# default-features = false switches off "https", "ssh" and
# "ssh_key_from_memory", which pull in openssl-sys and libssh2-sys. This crate
# performs no network operations — the only uses of the word "remote" are
# `BranchType::Remote` when listing remote-tracking branches and
# `find_remote()` when reading configured URLs, both purely local reads.
#
# The reason is simply that the code is dead weight: a TLS and SSH stack
# compiled into every binary for capability that does not exist. It also keeps
# OpenSSL, which carries its own licence terms, out of THIRD-PARTY-NOTICES.
#
# An earlier version of this comment claimed the bigger motive was build
# failures on unprepared machines. That was overstated, and the per-platform
# detail is worth recording because it is the opposite of what people assume:
#
#   Windows  needs nothing. openssl-sys is declared under
#            [target."cfg(unix)".dependencies], so Windows never pulls it;
#            libgit2 links winhttp/crypt32/secur32 instead.
#   Linux    needs OpenSSL development headers, or the vendored-openssl feature.
#   macOS    also needs OpenSSL — macOS is cfg(unix) — and its system LibreSSL
#            is not accepted, so Homebrew or vendored.
#
# "ssh" pulls libssh2-sys on every platform, but that is vendored C source and
# needs only the compiler this crate already requires. None of this affects
# anyone running a packaged application: the libraries are statically linked,
# so the cost lands on whoever compiles, never on an end user.
#
# When remote operations land, turn these back on in the same change as the
# credential handling they require, and update THIRD-PARTY-NOTICES.md.
git2 = { version = "0.18", default-features = false }
walkdir = "2.3"

# Node.js native module bindings (optional for testing)
napi = { version = "3.3", features = ["napi4", "tokio_rt"], optional = true }
napi-derive = { version = "3.0", optional = true }

# JSON serialization between Rust and JavaScript
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime (for future file watching, if needed)
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

# Logging. The `log` facade is used throughout; a concrete subscriber is only
# installed by GitService::new(), which exists solely under napi-binding — so
# env_logger rides along with that feature rather than burdening a plain
# `cargo build --no-default-features`.
log = "0.4"
env_logger = { version = "0.11", optional = true }

[build-dependencies]
napi-build = "2.2.3"

[features]
default = ["napi-binding"]
napi-binding = ["napi", "napi-derive", "env_logger"]

[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"
assert_matches = "1.5"
tokio-test = "0.4"
criterion = "0.5"
